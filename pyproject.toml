[project]
name = "drive-sync"
version = "2.1.0"
description = "Sync markdown files to Google Drive with Mermaid diagram support"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short"]

[tool.coverage.run]
source = ["src/drive_sync"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
